<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!--
      No inline scripts on purpose: the CSP (vercel.json) allows none, and the
      language is in the URL (/ro, /en, /fr), so nothing needs to run before paint.
      No description here and no <noscript> text, on purpose: link previews
      (Messenger, WhatsApp…) must show only the og:title, and they fall back to
      any description they find. Google runs the JS, which sets each page's
      description (useSeo).
      %VITE_SITE_URL% is substituted at build time from the env (vite.config.ts).
    -->
    <title>Horizon Auto Export — autoturisme noi și rulate, livrare în toată Europa</title>
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#08193D" />
    <link rel="canonical" href="%VITE_SITE_URL%/ro" />
    <link rel="alternate" hreflang="ro" href="%VITE_SITE_URL%/ro" />
    <link rel="alternate" hreflang="en" href="%VITE_SITE_URL%/en" />
    <link rel="alternate" hreflang="fr" href="%VITE_SITE_URL%/fr" />
    <link rel="alternate" hreflang="x-default" href="%VITE_SITE_URL%/ro" />
    <!-- The database API answers the first data request of every page: open
         its connection while the scripts are still downloading (~300 ms). -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Horizon Auto Export" />
    <meta property="og:title" content="Horizon Auto Export — Autovehicule noi și de ocazie" />
    <meta property="og:url" content="%VITE_SITE_URL%/ro" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logo Horizon Auto Export — Excellence Beyond Borders" />
    <meta property="og:locale" content="ro_RO" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Horizon Auto Export — Autovehicule noi și de ocazie" />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg?v=2" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoDealer",
        "name": "Horizon Auto Export S.R.L.",
        "url": "%VITE_SITE_URL%/",
        "logo": "%VITE_SITE_URL%/brand/logo-full-512.png",
        "image": "%VITE_SITE_URL%/og-image.jpg",
        "description": "Vânzare de vehicule noi și rulate, consiliere la achiziție și livrare în toată Europa.",
        "telephone": "+40759145041",
        "email": "contact@horizonautoexport.com",
        "vatID": "RO55177825",
        "areaServed": "EU",
        "address": { "@type": "PostalAddress", "streetAddress": "Str. Ilioara, Nr. 54, Sectorul 3", "addressLocality": "București", "addressCountry": "RO" },
        "openingHours": "Mo-Fr 09:00-18:00",
        "availableLanguage": ["ro", "en", "fr"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
